<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متصفح BWD</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Tahoma,sans-serif;
}

body{
    background:#111;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

.navbar{
    background:#1a1a1a;
    padding:10px;
    display:flex;
    gap:10px;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:8px;
    background:#00aaff;
    color:white;
    cursor:pointer;
}

button:hover{
    opacity:.8;
}

input{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}
</style>
</head>

<body>

<div class="navbar">
    <button onclick="back()">⬅</button>
    <button onclick="forward()">➡</button>
    <button onclick="reloadPage()">⟳</button>

    <input id="url" type="text" placeholder="اكتب رابط الموقع">

    <button onclick="go()">بحث</button>
</div>

<iframe id="browser" src="https://www.google.com"></iframe>

<script>
function go(){
    let url=document.getElementById("url").value;

    if(!url.startsWith("http")){
        url="https://"+url;
    }

    document.getElementById("browser").src=url;
}

function reloadPage(){
    document.getElementById("browser").src=
    document.getElementById("browser").src;
}

function back(){
    alert("زر الرجوع يحتاج تطبيق Electron أو لغة سطح مكتب.");
}

function forward(){
    alert("زر التقدم يحتاج تطبيق Electron أو لغة سطح مكتب.");
}
</script>

</body>
</html>
